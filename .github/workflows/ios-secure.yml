name: iOS Secure Seal Verify

on:
  push:
    paths:
      - 'ios-native/**'
      - '.github/workflows/ios-secure.yml'
  pull_request:
    paths:
      - 'ios-native/**'
  workflow_dispatch:

jobs:
  verify:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios-native
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build -v

      - name: Test
        run: swift test -v

