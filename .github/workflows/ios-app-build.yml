name: iOS App Build

on:
  push:
    paths:
      - 'ios-app/**'
      - '.github/workflows/ios-app-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios-app
    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JS deps
        run: npm install --no-audit --no-fund

      - name: Capacitor sync
        run: npx cap sync ios

      - name: Xcode build (simulator, unsigned)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Boot simulator
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -E '^\s+iPhone' | head -1 | sed -E 's/.*\(([0-9A-Fa-f-]+)\).*/\1/')
          echo "device=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b

      - name: Install and launch
        run: |
          APP="build/Build/Products/Debug-iphonesimulator/App.app"
          ls -la "$APP"
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch "$DEVICE" com.benguosa.game

      - name: Wait and screenshot
        run: |
          sleep 12
          xcrun simctl io "$DEVICE" screenshot simulator.png
          ls -l simulator.png

      - name: Upload simulator screenshot
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: ios-app/simulator.png
          if-no-files-found: error
